version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/[0-9][0-9]-*"
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [ci, dependencies]
